[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lcsrs"
version = "0.1.0"
description = "LeetCode spaced repetition CLI - track submissions, schedule FSRS reviews, review in a TUI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lcsrs contributors" }]
keywords = ["leetcode", "fsrs", "spaced-repetition", "cli", "tui"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Education",
]

dependencies = [
    "fsrs>=6.0.0",
    "sqlmodel>=0.0.24",
    "typer>=0.12",
    "textual>=0.80",
    "httpx>=0.27",
    "keyring>=25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.scripts]
lcsrs = "lcsrs.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lcsrs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/lcsrs"]
exclude = ["src/lcsrs/tui/"]
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
